[workspace]
members = [
    "crates/athanor-core",
    "crates/athanor-macros",
    "crates/athanor-crucible",
    "crates/athanor-opus",
    "crates/athanor-alembic",
    "crates/athanor-mcp",
    "crates/athanor-rag",
    "crates/athanor-atelier",
    "crates/athanor-evals",
    "examples/basic-artificer",
    "examples/durable-transmutation",
    "examples/sandboxed-alembic",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Athanor Contributors"]
repository = "https://github.com/pinguxx/athanor"
homepage = "https://github.com/pinguxx/athanor"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "json", "migrate"] }
wasmtime = "25.0"
wasmtime-wasi = "25.0"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
rust-embed = "8.5"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
fastembed = "3.8"
lancedb = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
futures = "0.3"

# Internal workspace crates
athanor-core = { path = "crates/athanor-core", version = "0.1.0" }
athanor-macros = { path = "crates/athanor-macros", version = "0.1.0" }
athanor-crucible = { path = "crates/athanor-crucible", version = "0.1.0" }
athanor-opus = { path = "crates/athanor-opus", version = "0.1.0" }
athanor-alembic = { path = "crates/athanor-alembic", version = "0.1.0" }
athanor-mcp = { path = "crates/athanor-mcp", version = "0.1.0" }
athanor-rag = { path = "crates/athanor-rag", version = "0.1.0" }
athanor-atelier = { path = "crates/athanor-atelier", version = "0.1.0" }
athanor-evals = { path = "crates/athanor-evals", version = "0.1.0" }
